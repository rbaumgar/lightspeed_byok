# Pull secret for registry.redhat.io — generate from a registry service account
# (access.redhat.com/terms-based-registry), not a personal login.
apiVersion: v1
kind: Secret
metadata:
  name: redhat-registry-pull-secret
  namespace: ${NAMESPACE}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ${REDHAT_REGISTRY_AUTH}
---
# Push secret for the registry where the built BYOK image is published.
apiVersion: v1
kind: Secret
metadata:
  name: registry-push-secret
  namespace: ${NAMESPACE}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ${PUSH_REGISTRY_AUTH}
